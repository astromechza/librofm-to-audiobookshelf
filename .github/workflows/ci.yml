name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: "v1.3.0"
  # Pin Redocly to a specific minor — upstream releases can otherwise break CI
  # with no repo change. Bump in lockstep with any deliberate spec/tooling work.
  REDOCLY_CLI_VERSION: "1.34.3"

jobs:

  # Always-on jobs — give the repo immediate value even before Go code lands.

  shellcheck:
    name: shellcheck (probe scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          severity: warning

  openapi-lint:
    name: lint OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: redocly lint
        run: npx --yes "@redocly/cli@${{ env.REDOCLY_CLI_VERSION }}" lint api/audiobookshelf.openapi.yaml

  # Go jobs — skipped cleanly until go.mod exists. The Go version comes from
  # the `go` directive in go.mod via `go-version-file` (single source of truth).

  detect-go:
    name: detect Go module
    runs-on: ubuntu-latest
    outputs:
      has_go: ${{ steps.check.outputs.has_go }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f go.mod ]; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: go build
    needs: detect-go
    if: needs.detect-go.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...

  test:
    name: go test (race + coverage)
    needs: detect-go
    if: needs.detect-go.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -coverprofile=cover.out -covermode=atomic ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out

  lint:
    name: golangci-lint
    needs: detect-go
    if: needs.detect-go.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    # TEMPORARY: golangci-lint v2.12.2 (current latest, May 2026) was built
    # with Go 1.25.10 and its bundled go/types panics when loading a module
    # whose `go` directive is 1.26+. Once a v2.13 release bundles Go 1.26,
    # drop continue-on-error AND add this job back to ci-pass's `needs`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          # `latest` auto-recovers when a newer linter that supports Go 1.26
          # is published — no repo change needed at that point.
          version: latest

  vuln:
    name: govulncheck
    needs: detect-go
    if: needs.detect-go.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - run: govulncheck ./...

  generate-drift:
    name: generate-drift check
    needs: detect-go
    if: needs.detect-go.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go generate
        run: go generate ./...
      - name: go mod tidy
        # `go mod tidy -diff` (Go 1.23+) fails non-zero without writing if tidy
        # would change anything — same semantics as the diff check below but
        # surfaces tidy-specific output. Belt-and-braces: also fall through to
        # the global git diff so any other generated file is covered.
        run: go mod tidy -diff
      - name: fail on diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::generated files, go.mod, or go.sum are out of date — run 'make generate && go mod tidy' and commit."
            exit 1
          fi

  docker-smoke:
    name: docker build smoke (multi-arch, no push)
    needs: detect-go
    if: needs.detect-go.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Aggregate gate. Configure ONLY this job as the required status check in
  # branch protection. It succeeds when every needed job either passed or
  # was legitimately skipped (e.g. before go.mod exists). Avoids the
  # "skipped status checks block PRs" trap that hits multi-job workflows.
  #
  # `lint` is intentionally NOT in `needs` while it's continue-on-error
  # (Go-1.26 vs golangci-lint mismatch). Add it back when the linter catches up.
  ci-pass:
    name: ci-pass
    needs:
      - shellcheck
      - openapi-lint
      - detect-go
      - build
      - test
      - vuln
      - generate-drift
      - docker-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verify no upstream job failed or was cancelled
        run: |
          fails='${{ toJson(needs) }}'
          echo "$fails"
          echo "$fails" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' >/dev/null \
            || { echo "::error::one or more required jobs failed or were cancelled"; exit 1; }
