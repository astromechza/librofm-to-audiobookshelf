name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOVULNCHECK_VERSION: "v1.3.0"
  GORELEASER_VERSION: "v2.3.2"
  # Pin Redocly to a specific minor — upstream releases can otherwise break CI
  # with no repo change. Bump in lockstep with any deliberate spec/tooling work.
  REDOCLY_CLI_VERSION: "1.34.3"

jobs:

  shellcheck:
    name: shellcheck (probe scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          severity: warning

  openapi-lint:
    name: lint OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: redocly lint
        run: npx --yes "@redocly/cli@${{ env.REDOCLY_CLI_VERSION }}" lint api/audiobookshelf.openapi.yaml

  test:
    name: go test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -coverprofile=cover.out -covermode=atomic ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # GOTOOLCHAIN=local forces `go install` to use the Go from setup-go
      # (matching go.mod). Without this, Go's auto-toolchain reads
      # govulncheck's own go.mod (`go 1.25.0`) and DOWNGRADES the install
      # toolchain to 1.25, producing a binary whose embedded go/types
      # can't parse our Go-1.26 source. Same trick is in the Makefile.
      - run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
        env:
          GOTOOLCHAIN: local
      - run: govulncheck ./...

  generate-drift:
    name: generate-drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go generate
        run: go generate ./...
      - name: go mod tidy
        # `go mod tidy -diff` (Go 1.23+) fails non-zero without writing if tidy
        # would change anything — same semantics as the diff check below but
        # surfaces tidy-specific output. Belt-and-braces: also fall through to
        # the global git diff so any other generated file is covered.
        run: go mod tidy -diff
      - name: fail on diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::generated files, go.mod, or go.sum are out of date — run 'make generate && go mod tidy' and commit."
            exit 1
          fi

  # Single smoke job covering the whole release pipeline at host arch:
  # GoReleaser produces the binary via the same config the release tag will
  # use, then we build the same `Dockerfile` (release-style: COPY of the
  # pre-built binary). No multi-arch / no QEMU — fast (host only) but
  # byte-identical to the release path.
  snapshot:
    name: goreleaser snapshot + docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # goreleaser changelog needs full history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: ${{ env.GORELEASER_VERSION }}
          # `build` (not `release`) supports --single-target. We only need to
          # prove the binary builds via the release pipeline; the docker step
          # follows below using the same Dockerfile the release will use.
          args: build --snapshot --single-target --clean
      - name: stage binary for docker build
        run: |
          set -euo pipefail
          binary=$(find dist -type f -name librofm-sync | head -1)
          if [ -z "$binary" ]; then
            echo "::error::no librofm-sync binary produced by goreleaser"
            exit 1
          fi
          cp "$binary" librofm-sync
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: librofm-sync:ci-snapshot
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: rm -f librofm-sync

  # Aggregate gate. Configure ONLY this job as the required status check in
  # branch protection. It succeeds when every needed job either passed or
  # was legitimately skipped. Avoids the "skipped status checks block PRs"
  # trap that hits multi-job workflows.
  ci-pass:
    name: ci-pass
    needs:
      - shellcheck
      - openapi-lint
      - test
      - lint
      - vuln
      - generate-drift
      - snapshot
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verify no upstream job failed or was cancelled
        run: |
          fails='${{ toJson(needs) }}'
          echo "$fails"
          echo "$fails" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' >/dev/null \
            || { echo "::error::one or more required jobs failed or were cancelled"; exit 1; }
