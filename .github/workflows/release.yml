name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write    # GoReleaser creates the GitHub Release
  packages: write    # push to ghcr.io
  id-token: write    # reserved for future keyless cosign signing

env:
  GORELEASER_VERSION: "v2.10.2"

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history for changelog generation

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod    # single source of truth (see go.mod `go` directive)
          cache: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
